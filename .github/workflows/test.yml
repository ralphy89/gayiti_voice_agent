name: Test API integration

on:
  pull_request:
  push:
    branches:
      - main
      - test/stage-2-api-coverage
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        run: node --experimental-strip-types --test --experimental-test-coverage tests/outreach.test.mjs
        env:
          NEXT_PUBLIC_N8N_WEBHOOK_URL: https://example.org/webhook/ci-placeholder
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_N8N_WEBHOOK_URL: https://example.org/webhook/ci-placeholder
